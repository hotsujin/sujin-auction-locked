 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(BOX.s),iterations:ITER,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
 const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(BOX.n)},key,b64(BOX.c));
 sessionStorage.setItem(KEY,password);
 if(remember)localStorage.setItem(DEVICE_KEY,password);else localStorage.removeItem(DEVICE_KEY);
 document.open();document.write(new TextDecoder().decode(plain));document.close();
}
async function attempt(password,quiet=false,remember=false){try{await openSite(password,remember);return true}catch(e){sessionStorage.removeItem(KEY);localStorage.removeItem(DEVICE_KEY);if(!quiet)document.getElementById('m').textContent='비밀번호가 맞지 않습니다.';return false}}
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();document.getElementById('m').textContent='확인 중…';await attempt(document.getElementById('p').value,false,document.getElementById('remember').checked)});
const saved=localStorage.getItem(DEVICE_KEY)||sessionStorage.getItem(KEY);if(saved)attempt(saved,true,true);
})();
